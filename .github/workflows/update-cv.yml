name: Publish updated CV PDF

on:
  push:
    branches: [master]
    paths:
      - 'cv-update.tex'
      - '.github/workflows/update-cv.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CV with LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv-update.tex
      - name: Replace CV PDF in website
        shell: bash
        run: |
          set -e
          test -s cv-update.pdf
          cp cv-update.pdf public/cv/Jialong_Li_CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv/Jialong_Li_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update downloadable CV to current one-page resume"
            git push
          fi
